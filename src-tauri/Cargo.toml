[package]
name = "openfocairouter"
version = "0.1.0"
description = "OpenFOC AI Router: free cloud LLM router for macOS"
authors = ["opnsrcntrbtr"]
license = "MIT"
edition = "2021"

[lib]
name = "openfocairouter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
